# XcodeGen spec for Cardano TxWorkshop.
#
# Generates TxWorkshop.xcodeproj, which is committed so Xcode Cloud can build it.
# Regenerate after editing with `just generate`.
#
#   • TxWorkshop        — iOS, iPadOS, macOS (App Store, sandboxed) and visionOS.
#   • TxWorkshopDirect  — macOS, Developer ID: outside the sandbox, built with
#                         DIRECT_DISTRIBUTION and linking TxWorkshopDirect.
name: TxWorkshop
options:
  bundleIdPrefix: com.kingpinapps
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    visionOS: "27.0"
  createIntermediateGroups: true
  # Sets LastUpgradeCheck, so Xcode does not offer the upgrade again.
  xcodeVersion: "27.0"
  localPackagesGroup: Packages

packages:
  TxWorkshop:
    path: .
  # Updates for the Developer ID build only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Enhanced Security: hardened heap, read-only dyld state, platform
    # restrictions, stack zero-init. See xcode-security-settings.md.
    ENABLE_ENHANCED_SECURITY: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # No team by default: the simulators sign ad hoc, and macOS signs "to run
    # locally". TxWorkshop sets its team below; TxWorkshopDirect still signs
    # ad hoc until notarisation is set up.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    "CODE_SIGN_STYLE[sdk=macosx*]": Manual
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    # The libsodium and BLST binaries in the Cardano stack ship only arm64 for
    # the visionOS simulator, which runs on Apple silicon alone anyway.
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64

# The document types every app target reads and writes.
documentTypes: &documentTypes
  CFBundleDocumentTypes:
    - CFBundleTypeName: Cardano TxWorkshop Document
      CFBundleTypeRole: Editor
      LSHandlerRank: Owner
      LSTypeIsPackage: true
      LSItemContentTypes: [com.kingpinapps.cardano-txworkshop.document]
    - CFBundleTypeName: Cardano Transaction
      CFBundleTypeRole: Editor
      LSHandlerRank: Alternate
      LSItemContentTypes:
        - com.kingpinapps.cardano-txworkshop.text-envelope
        - com.kingpinapps.cardano-txworkshop.transaction-cbor
        - com.kingpinapps.cardano-txworkshop.transaction-hex
  UTExportedTypeDeclarations:
    - UTTypeIdentifier: com.kingpinapps.cardano-txworkshop.document
      UTTypeDescription: Cardano TxWorkshop Document
      UTTypeConformsTo: [com.apple.package, public.content]
      UTTypeTagSpecification:
        public.filename-extension: [txworkshop]
    - UTTypeIdentifier: com.kingpinapps.cardano-txworkshop.text-envelope
      UTTypeDescription: Cardano Transaction Envelope
      UTTypeConformsTo: [public.json, public.data]
      UTTypeTagSpecification:
        public.filename-extension: [tx, signed, txsigned, witnessed]
    - UTTypeIdentifier: com.kingpinapps.cardano-txworkshop.transaction-cbor
      UTTypeDescription: Cardano Transaction CBOR
      UTTypeConformsTo: [public.data]
      UTTypeTagSpecification:
        public.filename-extension: [cbor]
    - UTTypeIdentifier: com.kingpinapps.cardano-txworkshop.transaction-hex
      UTTypeDescription: Cardano Transaction Hex
      UTTypeConformsTo: [public.plain-text]
      UTTypeTagSpecification:
        public.filename-extension: [hex, txhex]

targets:
  TxWorkshop:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    productName: Cardano TxWorkshop
    sources:
      - App
      # Icon Composer icon for iPhone, iPad and Mac. visionOS cannot read a
      # .icon, so it has its own layered icon, chosen per SDK below.
      - path: Icon/AppIcon.icon
        buildPhase: resources
      - path: Icon/AppIconVision.xcassets
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        <<: *documentTypes
        # Short on home screens, full on the Mac: see APP_DISPLAY_NAME below.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        LSApplicationCategoryType: public.app-category.developer-tools
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # iPad multitasking needs every orientation; iPhone leaves out
        # upside down, as Apple's templates do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Cardano TxWorkshop scans the animated QR codes a Keystone hardware wallet shows.
        NSBluetoothAlwaysUsageDescription: Cardano TxWorkshop connects to your Ledger over Bluetooth to sign transactions.
        NSFaceIDUsageDescription: Cardano TxWorkshop asks for Face ID or Optic ID before signing with a key it keeps.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: TxWorkshop
        product: TxWorkshopCore
      - package: TxWorkshop
        product: TxWorkshopEngine
      - package: TxWorkshop
        product: TxWorkshopUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingpinapps.cardano-txworkshop
        PRODUCT_NAME: Cardano TxWorkshop
        # The name under the icon. Home screens cut "Cardano TxWorkshop" short,
        # so iPhone, iPad and Vision Pro show "TxWorkshop"; the App Store name
        # stays "Cardano TxWorkshop" (fastlane/metadata).
        APP_DISPLAY_NAME: Cardano TxWorkshop
        "APP_DISPLAY_NAME[sdk=iphoneos*]": TxWorkshop
        "APP_DISPLAY_NAME[sdk=iphonesimulator*]": TxWorkshop
        "APP_DISPLAY_NAME[sdk=xros*]": TxWorkshop
        "APP_DISPLAY_NAME[sdk=xrsimulator*]": TxWorkshop
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": AppIconVision
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ENABLE_HARDENED_RUNTIME: YES
        # libsodium and BLST ship as prebuilt binaries with no arm64e slice,
        # so pointer authentication (and the arm64e.x1 slice) must stay off.
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO
        CODE_SIGN_ENTITLEMENTS: App/TxWorkshop.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TxWorkshop-macOS.entitlements
        # Signs with the team on every platform, overriding the ad hoc macOS
        # signing in the base settings.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: G88W6X4TCA
        PROVISIONING_PROFILE_SPECIFIER: ""

  TxWorkshopDirect:
    type: application
    platform: macOS
    productName: Cardano TxWorkshop Direct
    sources:
      - AppDirect
      # The accent colour and icon are shared with the App Store build.
      - App/Assets.xcassets
      - path: Icon/AppIcon.icon
        buildPhase: resources
    info:
      path: AppDirect/Info.plist
      properties:
        <<: *documentTypes
        CFBundleDisplayName: Cardano TxWorkshop
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Cardano TxWorkshop connects to your Ledger over Bluetooth to sign transactions.
        # Sparkle: the appcast lives on the public releases repo's latest
        # release. SUPublicEDKey is filled in by scripts/release-direct.sh
        # setup (the private key stays in the login Keychain).
        SUFeedURL: https://github.com/Kingpin-Apps/cardano-txworkshop-releases/releases/latest/download/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
    dependencies:
      - package: TxWorkshop
        product: TxWorkshopCore
      - package: TxWorkshop
        product: TxWorkshopEngine
      - package: TxWorkshop
        product: TxWorkshopUI
      - package: TxWorkshop
        product: TxWorkshopDirect
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingpinapps.cardano-txworkshop
        # Its own product name, so it never overwrites the App Store build;
        # it still shows as "Cardano TxWorkshop".
        PRODUCT_NAME: Cardano TxWorkshop Direct
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT_DISTRIBUTION
        ENABLE_HARDENED_RUNTIME: YES
        # libsodium and BLST ship as prebuilt binaries with no arm64e slice,
        # so pointer authentication (and the arm64e.x1 slice) must stay off.
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO
        CODE_SIGN_ENTITLEMENTS: AppDirect/TxWorkshopDirect.entitlements


schemes:
  TxWorkshop:
    build:
      targets:
        TxWorkshop: all
    test:
      targets: []
  TxWorkshopDirect:
    build:
      targets:
        TxWorkshopDirect: all
