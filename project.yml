# XcodeGen spec for Cardano Tx Workshop.
#
# Generates TxWorkshop.xcodeproj, which is committed so Xcode Cloud can build it.
# Regenerate after editing with `just generate`.
#
#   • TxWorkshop        — iOS, iPadOS, macOS (App Store, sandboxed) and visionOS.
#   • TxWorkshopDirect  — macOS, Developer ID: outside the sandbox, built with
#                         DIRECT_DISTRIBUTION and linking TxWorkshopDirect.
name: TxWorkshop
options:
  bundleIdPrefix: com.kingpinapps
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    visionOS: "27.0"
  createIntermediateGroups: true
  localPackagesGroup: Packages

packages:
  TxWorkshop:
    path: .
  # Updates for the Developer ID build only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Enhanced Security: hardened heap, read-only dyld state, platform
    # restrictions, stack zero-init. See xcode-security-settings.md.
    ENABLE_ENHANCED_SECURITY: YES
    DEAD_CODE_STRIPPING: YES
    # No team yet: the simulators sign ad hoc, and macOS signs "to run locally".
    # Set DEVELOPMENT_TEAM for devices, TestFlight and notarisation.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    "CODE_SIGN_STYLE[sdk=macosx*]": Manual
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    # The libsodium and BLST binaries in the Cardano stack ship only arm64 for
    # the visionOS simulator, which runs on Apple silicon alone anyway.
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64

# The document types every app target reads and writes.
documentTypes: &documentTypes
  CFBundleDocumentTypes:
    - CFBundleTypeName: Tx Workshop Document
      CFBundleTypeRole: Editor
      LSHandlerRank: Owner
      LSTypeIsPackage: true
      LSItemContentTypes: [com.kingpinapps.txworkshop.document]
    - CFBundleTypeName: Cardano Transaction
      CFBundleTypeRole: Editor
      LSHandlerRank: Alternate
      LSItemContentTypes:
        - com.kingpinapps.txworkshop.text-envelope
        - com.kingpinapps.txworkshop.transaction-cbor
        - com.kingpinapps.txworkshop.transaction-hex
  UTExportedTypeDeclarations:
    - UTTypeIdentifier: com.kingpinapps.txworkshop.document
      UTTypeDescription: Tx Workshop Document
      UTTypeConformsTo: [com.apple.package, public.content]
      UTTypeTagSpecification:
        public.filename-extension: [txworkshop]
    - UTTypeIdentifier: com.kingpinapps.txworkshop.text-envelope
      UTTypeDescription: Cardano Transaction Envelope
      UTTypeConformsTo: [public.json, public.data]
      UTTypeTagSpecification:
        public.filename-extension: [tx, signed, txsigned, witnessed]
    - UTTypeIdentifier: com.kingpinapps.txworkshop.transaction-cbor
      UTTypeDescription: Cardano Transaction CBOR
      UTTypeConformsTo: [public.data]
      UTTypeTagSpecification:
        public.filename-extension: [cbor]
    - UTTypeIdentifier: com.kingpinapps.txworkshop.transaction-hex
      UTTypeDescription: Cardano Transaction Hex
      UTTypeConformsTo: [public.plain-text]
      UTTypeTagSpecification:
        public.filename-extension: [hex, txhex]

targets:
  TxWorkshop:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        <<: *documentTypes
        CFBundleDisplayName: Tx Workshop
        LSApplicationCategoryType: public.app-category.developer-tools
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        NSCameraUsageDescription: Tx Workshop scans the animated QR codes a Keystone hardware wallet shows.
        NSBluetoothAlwaysUsageDescription: Tx Workshop connects to your Ledger over Bluetooth to sign transactions.
        NSFaceIDUsageDescription: Tx Workshop asks for Face ID or Optic ID before signing with a key it keeps.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: TxWorkshop
        product: TxWorkshopCore
      - package: TxWorkshop
        product: TxWorkshopEngine
      - package: TxWorkshop
        product: TxWorkshopUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingpinapps.txworkshop
        PRODUCT_NAME: Tx Workshop
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No icon yet (see docs/release-checklist.md).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ENABLE_HARDENED_RUNTIME: YES
        # libsodium and BLST ship as prebuilt binaries with no arm64e slice,
        # so pointer authentication (and the arm64e.x1 slice) must stay off.
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO
        CODE_SIGN_ENTITLEMENTS: App/TxWorkshop.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TxWorkshop-macOS.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""

  TxWorkshopDirect:
    type: application
    platform: macOS
    sources:
      - AppDirect
      # The accent colour is shared with the App Store build.
      - App/Assets.xcassets
    info:
      path: AppDirect/Info.plist
      properties:
        <<: *documentTypes
        CFBundleDisplayName: Tx Workshop
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Tx Workshop connects to your Ledger over Bluetooth to sign transactions.
        # Sparkle: the appcast lives on the public releases repo's latest
        # release. SUPublicEDKey is filled in by scripts/release-direct.sh
        # setup (the private key stays in the login Keychain).
        SUFeedURL: https://github.com/Kingpin-Apps/tx-workshop-releases/releases/latest/download/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
    dependencies:
      - package: TxWorkshop
        product: TxWorkshopCore
      - package: TxWorkshop
        product: TxWorkshopEngine
      - package: TxWorkshop
        product: TxWorkshopUI
      - package: TxWorkshop
        product: TxWorkshopDirect
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingpinapps.txworkshop
        # Its own product name, so it never overwrites the App Store build;
        # it still shows as "Tx Workshop".
        PRODUCT_NAME: Tx Workshop Direct
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT_DISTRIBUTION
        ENABLE_HARDENED_RUNTIME: YES
        # libsodium and BLST ship as prebuilt binaries with no arm64e slice,
        # so pointer authentication (and the arm64e.x1 slice) must stay off.
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO
        CODE_SIGN_ENTITLEMENTS: AppDirect/TxWorkshopDirect.entitlements


schemes:
  TxWorkshop:
    build:
      targets:
        TxWorkshop: all
    test:
      targets: []
  TxWorkshopDirect:
    build:
      targets:
        TxWorkshopDirect: all
